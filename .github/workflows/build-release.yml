name: SuperR7 release candidate
run-name: Build SuperR7 release candidate

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'Luna*'

permissions:
  contents: write

jobs:
  build-candidate:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install build and test dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc gcc-arm-none-eabi lcov python3-pil

      - name: Run host tests
        run: |
          make -C tests
          python3 -m unittest discover -s tests -p '*_test.py'

      - name: Build SuperR7 for SuperCard SD
        run: |
          make BOARD=sd clean
          make BOARD=sd COMPRESSION_RATIO=10 superr7.gba

      - name: Verify and package candidate
        run: |
          size=$(stat -c %s superr7.gba)
          test "$size" -le 524288
          mkdir -p dist
          if [[ "$GITHUB_REF" == refs/tags/Luna* ]]; then
            asset="SuperR7-SD-${GITHUB_REF_NAME}.gba"
          else
            asset="superr7.gba"
          fi
          cp superr7.gba "dist/$asset"
          sha256sum "dist/$asset" > "dist/$asset.sha256"
          printf 'asset=%s\nsize=%s\ncommit=%s\n' \
            "$asset" "$size" "$GITHUB_SHA" > dist/build-info.txt

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: superr7-candidate-${{ github.sha }}
          path: dist/*

  draft-release:
    needs: build-candidate
    if: startsWith(github.ref, 'refs/tags/Luna')
    runs-on: ubuntu-24.04

    steps:
      - name: Download candidate
        uses: actions/download-artifact@v4
        with:
          name: superr7-candidate-${{ github.sha }}
          path: dist

      - name: Create draft release
        run: |
          asset="SuperR7-SD-${GITHUB_REF_NAME}.gba"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --generate-notes \
            --title "SuperR7 $GITHUB_REF_NAME" \
            "dist/$asset" \
            "dist/$asset.sha256" \
            dist/build-info.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

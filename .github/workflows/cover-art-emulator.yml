name: SuperR7 cover art emulator

on:
  workflow_dispatch:
  push:
    branches:
      - feature/cover-art
      - feature/ui-browser
      - superr7/main

jobs:
  mgba-cover-demo:
    runs-on: ubuntu-24.04

    steps:
      - name: Install build and visual-test dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi curl python3-pil

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build standard-GBA cover demo
        run: |
          make BOARD=sd cover-demo.gba
          make BOARD=sd ingame-menu-demo.gba

      - name: Install official mGBA development headless build
        run: |
          curl -fsSL https://s3.amazonaws.com/mgba/mGBA-build-latest-ubuntu64-noble.tar.xz -o /tmp/mgba.tar.xz
          mkdir -p /tmp/mgba
          tar -xf /tmp/mgba.tar.xz -C /tmp/mgba
          sudo apt-get install -y \
            "$(find /tmp/mgba -name libmgba.deb -print -quit)" \
            "$(find /tmp/mgba -name mgba-headless.deb -print -quit)"
          dpkg-query -W -f='${Version}\n' mgba-headless

      - name: Capture scripted emulator states
        run: |
          mkdir -p artifacts/cover-demo
          timeout 15s mgba-headless --script tools/mgba-cover-demo.lua cover-demo.gba || test -f artifacts/cover-demo/complete.txt
          test -f artifacts/cover-demo/complete.txt

      - name: Verify framebuffer output
        run: python3 tests/cover_demo_visual.py

      - name: Capture and verify the SuperR7 in-game menu
        run: |
          mkdir -p artifacts/ingame-menu
          timeout 85s mgba-headless --script tools/mgba-ingame-menu.lua ingame-menu-demo.gba || test -f artifacts/ingame-menu/complete.txt
          test -f artifacts/ingame-menu/complete.txt
          PYTHONPATH=. python3 tests/ingame_menu_visual.py

      - name: Upload demo ROM and reference screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: superr7-cover-art-mgba-demo
          path: |
            cover-demo.gba
            firmware.demo.ewram.elf
            firmware.demo.ewram.map
            artifacts/cover-demo/*
            ingame-menu-demo.gba
            firmware.ingame.demo.ewram.elf
            firmware.ingame.demo.ewram.map
            artifacts/ingame-menu/*
